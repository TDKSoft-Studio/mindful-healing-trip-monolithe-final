name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mirrors `task ci` exactly (contract §30-32): gitleaks -> format:check ->
# lint -> typecheck -> migrate -> seed -> test:coverage -> build -> test:e2e.
# Keep these two in sync - if a step is added/removed here, mirror it in
# Taskfile.yml, and vice versa.
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mindfultrip:devpassword@localhost:5432/mindfultrip?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONTACT_EMAIL: info-healingtrip@nextgen-care.org
      SMTP_HOST: localhost
      SMTP_PORT: "1025"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mindfultrip
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: mindfultrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindfultrip -d mindfultrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # SMTP test server for the contact form's e2e test (contract §29) -
      # mirrors compose.yaml's mailpit service.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast on the most severe issue class (a committed secret) before
      # spending time on anything else - mirrors `security:gitleaks` being
      # the first step of `task ci` (see Taskfile.yml). Installs the OSS
      # gitleaks CLI directly rather than gitleaks/gitleaks-action@v2: the
      # action now gates organization repos behind a paid license
      # (GITLEAKS_LICENSE secret) - the underlying CLI itself remains free,
      # so downloading it from GitHub Releases keeps this a real, working
      # secret scan without buying a license just to run our own tooling.
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks (secret scan)
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Unit + integration tests (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
