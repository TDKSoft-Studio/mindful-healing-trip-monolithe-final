name: Publish Image

# Publishes the production OCI image to GHCR once the CI workflow has
# passed on `main`. Deliberately a separate workflow from ci.yml, which
# mirrors `task ci` exactly (see its own header comment) — image
# publishing is a distinct concern (build once, promote the same
# artifact everywhere; see the infrastructure repository's
# docs/CLAUDE.md §44/§45) and must never be an implicit side effect of
# the test/lint/build pipeline, nor run on unreviewed pull request code.
#
# This is the single build point for the application image: the
# infrastructure repository never rebuilds it — it only ever references
# the digest published here (docs/CLAUDE.md §44 in the infrastructure
# repository).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Lets an operator re-publish without a new commit (e.g. after a
  # transient registry failure), and lets a fix to this Dockerfile/build
  # be validated for real on its own branch before merging to main --
  # workflow_dispatch is independent of the workflow_run gate above (no
  # `if: conclusion == 'success'` check applies to it), so use it only
  # when you already trust the commit being built.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tdksoft-studio/mindful-healing-trip-monolithe-final

jobs:
  publish:
    # Only publish when CI actually passed on the commit that triggered
    # it — a `workflow_run` fires regardless of the upstream conclusion,
    # so this check is load-bearing, not decorative. A manual
    # workflow_dispatch has no upstream conclusion to check -- dispatching
    # it at all is the trust signal, e.g. to validate a fix on its own
    # branch before merging to main.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Single source of truth for "which commit" and "which tags" so the
      # rest of this job doesn't need to know which trigger fired it.
      - name: Compute revision and tags
        id: meta
        run: |
          set -Eeuo pipefail
          REVISION="${{ github.event.workflow_run.head_sha }}"
          if [ -z "${REVISION}" ]; then
            REVISION="${{ github.sha }}"
          fi
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<PUBLISH_TAGS_EOF"
            echo "${IMAGE}:${REVISION}"
            # :latest only for a real workflow_run publish off main -- a
            # manual workflow_dispatch (e.g. testing a fix branch) must
            # never overwrite it with an unmerged commit's build.
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "PUBLISH_TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Checkout the exact commit CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_SITE_URL is inlined into the client bundle at
          # build time (Dockerfile ARG) — one shared artifact is
          # promoted to both staging and production (infra §45), so it
          # is baked with the confirmed production canonical domain.
          # Staging showing production canonical URLs is a known,
          # already-documented limitation (see the infrastructure
          # repository's deploy/helm/mindfultrip/README.md "Known
          # limitations"), not something this workflow can fix.
          #
          # No DATABASE_URL here: every DB-backed route is rendered
          # dynamically (see the Dockerfile's `builder` stage comment),
          # so `docker build` no longer touches PostgreSQL at all --
          # DATABASE_URL is runtime-only, injected via a Kubernetes
          # Secret (see docs/ARCHITECTURE.md).
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://healingtrip.nextgen-cares.org
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Explicitly off for now, not forgotten: keeps the pushed
          # artifact a single, unambiguous digest while the supply-chain
          # controls in docs/CLAUDE.md §51 (SBOM, provenance, signing)
          # are still at "not yet adopted" maturity. Revisit together
          # when that maturity level changes.
          provenance: false
          sbom: false

      - name: Record the published artifact
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Git revision: \`${REVISION}\`"
            echo "Trigger: \`${EVENT_NAME}\`"
            echo
            echo "Use this digest — not a tag — as \`web.image.digest\` when"
            echo "deploying via the infrastructure repository"
            echo "(docs/CLAUDE.md §14 there: production requires an immutable"
            echo "digest, never a mutable tag)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
