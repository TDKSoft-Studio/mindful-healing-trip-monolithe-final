# Taskfile - primary developer interface for Mindful Healing Trips
# (contract §25-26). Mirrors .github/workflows/ci.yml exactly so that
# `task ci` green locally means CI green on GitHub (contract §31-32).
version: "3"

vars:
  COMPOSE: docker compose

tasks:
  default:
    desc: "List available tasks."
    cmd: task --list

  # --- Setup / dev ------------------------------------------------------
  setup:
    desc: "From zero to a working dev environment (idempotent)."
    cmds:
      - 'echo "==> Checking prerequisites"'
      - 'command -v docker >/dev/null || { echo "Docker is required (see docker.com)"; exit 1; }'
      - 'command -v pnpm >/dev/null || { echo "pnpm is required (see pnpm.io)"; exit 1; }'
      - 'command -v gitleaks >/dev/null || { echo "gitleaks is required (see https://github.com/gitleaks/gitleaks#installing) - task ci runs a secret scan"; exit 1; }'
      - "test -f .env.local || cp .env.example .env.local"
      - 'echo "==> Installing dependencies"'
      # No --frozen-lockfile here (unlike ci.yml's "Install dependencies"
      # step): a dev bootstrap is allowed to update the lockfile against a
      # newly-edited package.json, CI must not (reproducibility). Both
      # environments create/have .env.local's DATABASE_URL before this
      # runs, so the `postinstall` hook (`prisma generate`) can resolve it
      # either way - see prisma.config.ts.
      - pnpm install
      - 'echo "==> Starting postgres + mailpit"'
      - "{{.COMPOSE}} up -d postgres mailpit"
      - task: db:wait
      - 'echo "==> Applying migrations"'
      - pnpm db:migrate:deploy
      - 'echo "==> Seeding development data"'
      - pnpm db:seed
      - 'echo "==> Setup complete. Next: task dev, or task ci"'

  db:wait:
    desc: "Wait until postgres is ready to accept connections."
    internal: true
    cmds:
      - |
        for i in $(seq 1 30); do
          {{.COMPOSE}} exec -T postgres pg_isready -U mindfultrip -d mindfultrip >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "postgres did not become ready in time"
        exit 1

  dev:
    desc: "Start the local dev environment (app + postgres + mailpit)."
    cmd: "{{.COMPOSE}} up"

  # --- Build --------------------------------------------------------------
  build:
    desc: "Production build of the Next.js app."
    cmd: pnpm build

  # --- Quality ------------------------------------------------------------
  lint:
    desc: "Lint the codebase."
    cmd: pnpm lint

  typecheck:
    desc: "TypeScript strict type checking (no emit)."
    cmd: pnpm typecheck

  format:
    desc: "Format the codebase with Prettier."
    cmd: pnpm format

  "format:check":
    desc: "Check formatting without writing changes."
    cmd: pnpm format:check

  # --- Security -------------------------------------------------------------
  # gitleaks IS part of `task ci` (unlike security:audit below): a finding
  # is about *our own* commit content - deterministic per-commit, exactly
  # like lint/typecheck - not a third-party advisory that can appear with
  # no change on our side. Requires gitleaks installed locally (checked in
  # `task setup`, see https://github.com/gitleaks/gitleaks#installing);
  # CI installs the binary itself from GitHub Releases (see ci.yml) - not
  # via gitleaks/gitleaks-action, which now requires a paid license for
  # organization repos.
  "security:gitleaks":
    desc: "Scan the repository for committed secrets (contract §36)."
    cmd: gitleaks detect --source . --config .gitleaks.toml --no-banner

  # Not part of `task ci` (contract §33: checks must stay fast and non-
  # fragile) - a transitive advisory can appear with no code change on our
  # side, which would make CI flaky for reasons outside this PR's diff.
  # Run periodically / before a release instead (contract §36 "dépendances
  # maintenues").
  "security:audit":
    desc: "Check dependencies for known vulnerabilities."
    cmd: pnpm audit

  # --- Tests ----------------------------------------------------------------
  test:
    desc: "Run unit + integration tests (Vitest). Integration tests need a migrated, seeded DB."
    cmd: pnpm test

  "test:coverage":
    desc: "Run unit + integration tests with coverage (90% threshold, business-logic layer)."
    cmd: pnpm test:coverage

  "test:e2e":
    desc: "Run end-to-end tests (Playwright). Builds first."
    # Unlike ci.yml, this doesn't install Playwright browsers: CI runners
    # are ephemeral and need `playwright install --with-deps chromium` on
    # every run, a dev machine only needs `task playwright:install` once
    # (see README "Tests"). Both use the same `pnpm test:e2e` command.
    cmds:
      - pnpm build
      - pnpm test:e2e

  "playwright:install":
    desc: "Install Playwright browsers once for local test:e2e runs."
    # Idempotent: skips the (slow) download if chromium is already cached
    # at Playwright's default location, so re-running this after it's
    # already done is instant. If PLAYWRIGHT_BROWSERS_PATH is set to a
    # custom location, this check won't see it - harmless, `playwright
    # install` itself is a no-op when the browser is already present.
    status:
      - test -d "$HOME/.cache/ms-playwright"/chromium-*
    cmd: pnpm exec playwright install chromium

  # --- Database ---------------------------------------------------------
  "db:migrate":
    desc: "Create/apply a dev migration."
    cmd: pnpm db:migrate

  "db:seed":
    desc: "Seed the development database."
    cmd: pnpm db:seed

  "db:reset":
    desc: "Reset the database (drop, recreate, migrate, seed)."
    cmd: pnpm db:reset

  # --- Local CI -------------------------------------------------------------
  # Keep this task's step order identical to .github/workflows/ci.yml
  # (contract §31-32) - a step added/removed here must be mirrored there.
  # Migrations + seed run before `test:coverage` because the integration
  # tests (tests/integration/) query real seeded Trip/Destination rows.
  # test:coverage instead of plain test: same test run, plus the 90%
  # coverage gate - no point running the suite twice. Gitleaks runs first -
  # fail fast on the most severe issue class (a committed secret) before
  # spending time on anything else.
  ci:
    desc: "Run the full local CI pipeline - mirrors .github/workflows/ci.yml."
    cmds:
      - task: "security:gitleaks"
      - task: "format:check"
      - task: lint
      - task: typecheck
      - cmd: pnpm db:migrate:deploy
      - cmd: pnpm db:seed
      - task: "test:coverage"
      - task: "test:e2e" # builds internally, then runs Playwright

  # --- Docker -----------------------------------------------------------
  "docker:build":
    desc: "Build the production Docker image."
    cmd: docker build -t mindful-healing-trips .

  "docker:up":
    desc: "Start the full stack via Docker Compose."
    cmd: "{{.COMPOSE}} up -d"

  "docker:down":
    desc: "Stop the Docker Compose stack."
    cmd: "{{.COMPOSE}} down"

  # --- Observability ------------------------------------------------------
  health:
    desc: "Check the running app's health endpoint."
    cmd: "curl -fsS http://localhost:3000/api/health && echo"
